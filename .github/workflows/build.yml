name: Build and test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test solution
        run: dotnet test WardogsRadio.sln -c Release
      - name: Test visible YouTube controller
        run: node tests/youtube-player.behavior.test.cjs
      - name: Publish Windows x64 app
        shell: pwsh
        env:
          WARDOGS_YOUTUBE_SEARCH_KEY: ${{ secrets.WARDOGS_YOUTUBE_SEARCH_KEY }}
        run: |
          $arguments = @('publish', 'src/WardogsRadio.App/WardogsRadio.App.csproj', '-c', 'Release', '-r', 'win-x64', '--self-contained', 'true', '-o', 'artifacts/win-x64')
          if (-not [string]::IsNullOrWhiteSpace($env:WARDOGS_YOUTUBE_SEARCH_KEY)) {
            $keyFile = Join-Path $env:RUNNER_TEMP 'wardogs-youtube-search-key.txt'
            [IO.File]::WriteAllText($keyFile, $env:WARDOGS_YOUTUBE_SEARCH_KEY.Trim())
            $arguments += "-p:YouTubeDefaultKeyFile=$keyFile"
            'YOUTUBE_SEARCH_BUNDLED=true' >> $env:GITHUB_ENV
          }
          dotnet @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: env.YOUTUBE_SEARCH_BUNDLED == 'true'
        with:
          name: wardogs-radio-win-x64
          path: artifacts/win-x64/
