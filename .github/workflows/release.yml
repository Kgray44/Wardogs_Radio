name: Release WARDOGS Radio

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and qualify without publishing a GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Verify version and select release tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content WARDOGS_VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'WARDOGS_VERSION must be major.minor.patch.' }
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { "v$version" }
          if ($tag -ne "v$version") { throw "Tag $tag does not match WARDOGS_VERSION $version." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Restore, build, and test
        shell: pwsh
        run: |
          dotnet restore WardogsRadio.sln -r win-x64
          dotnet build WardogsRadio.sln -c Release --no-restore
          dotnet test WardogsRadio.sln -c Release --no-restore
          node tests/youtube-player.behavior.test.cjs
      - name: Install 7-Zip for MPV packaging
        shell: pwsh
        run: choco install 7zip -y --no-progress
      - name: Prepare private YouTube Search key
        shell: pwsh
        env:
          WARDOGS_YOUTUBE_SEARCH_KEY: ${{ secrets.WARDOGS_YOUTUBE_SEARCH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WARDOGS_YOUTUBE_SEARCH_KEY)) { throw 'Configure the WARDOGS_YOUTUBE_SEARCH_KEY GitHub Actions secret before release packaging.' }
          $keyFile = Join-Path $env:RUNNER_TEMP 'wardogs-youtube-search-key.txt'
          [IO.File]::WriteAllText($keyFile, $env:WARDOGS_YOUTUBE_SEARCH_KEY.Trim())
          "WARDOGS_YOUTUBE_SEARCH_KEY_FILE=$keyFile" >> $env:GITHUB_ENV
      - name: Stage complete self-contained package
        shell: pwsh
        run: .\scripts\stage-package.ps1 -StageDir "$PWD\release\stage"
      - name: Verify staged binaries have icon resources
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($binary in @('WARDOGS Radio.exe','WARDOGS Radio Launcher.exe','WARDOGS Radio Update Agent.exe')) {
            $icon = [Drawing.Icon]::ExtractAssociatedIcon("$PWD\release\stage\$binary")
            if ($null -eq $icon) { throw "Missing usable icon: $binary" }
            $icon.Dispose()
          }
      - name: Record unsigned build when signing is disabled
        if: vars.ARTIFACT_SIGNING_ENABLED != 'true'
        shell: pwsh
        run: Add-Content $env:GITHUB_STEP_SUMMARY '## UNSIGNED RELEASE BUILD`nNo configured trusted signing service; release continues unsigned.'
      - name: Azure login for optional Artifact Signing
        if: vars.ARTIFACT_SIGNING_ENABLED == 'true'
        uses: Azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign package files when configured
        if: vars.ARTIFACT_SIGNING_ENABLED == 'true'
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\release\stage\WARDOGS Radio.exe
            ${{ github.workspace }}\release\stage\WARDOGS Radio Launcher.exe
            ${{ github.workspace }}\release\stage\WARDOGS Radio Update Agent.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Refresh signed package inventory
        shell: pwsh
        run: .\scripts\refresh-package-inventory.ps1 -StageDir "$PWD\release\stage"
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Official Inno Setup installer SHA-256 did not match the reviewed value.' }
          $install = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno Setup installer failed with $($install.ExitCode)." }
          $entry = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*','HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Inno Setup version 6*' } | Select-Object -First 1
          if ($null -eq $entry -or -not (Test-Path (Join-Path $entry.InstallLocation 'ISCC.exe'))) { throw 'Inno Setup 6 compiler was not installed.' }
          "INNO_ISCC=$(Join-Path $entry.InstallLocation 'ISCC.exe')" >> $env:GITHUB_ENV
      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -StageDir "$PWD\release\stage" -OutputDir "$PWD\release" -Iscc $env:INNO_ISCC
      - name: Sign installer when configured
        if: vars.ARTIFACT_SIGNING_ENABLED == 'true'
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\release\WARDOGS-Radio-Setup-v${{ steps.version.outputs.version }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Smoke install, health check, and uninstall
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'wardogs-radio-installer-smoke'
          .\scripts\verify-installer-upgrade.ps1 -InstallerPath "$PWD\release\WARDOGS-Radio-Setup-v${{ steps.version.outputs.version }}.exe" -InstallDir $target
          $uninstall = Start-Process -FilePath "$target\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$target\WARDOGS Radio.exe")) { throw 'Installer uninstall smoke test failed.' }
      - name: Generate manifest and checksums
        shell: pwsh
        run: .\scripts\generate-release-assets.ps1 -InstallerPath "$PWD\release\WARDOGS-Radio-Setup-v${{ steps.version.outputs.version }}.exe" -OutputDir "$PWD\release" -ReleaseTag '${{ steps.version.outputs.tag }}'
      - uses: actions/upload-artifact@v4
        with:
          name: WARDOGS-Radio-v${{ steps.version.outputs.version }}
          path: |
            release/WARDOGS-Radio-Setup-v${{ steps.version.outputs.version }}.exe
            release/update-manifest.json
            release/SHA256SUMS.txt
      - name: Publish stable GitHub Release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create '${{ steps.version.outputs.tag }}' release/WARDOGS-Radio-Setup-v${{ steps.version.outputs.version }}.exe release/update-manifest.json release/SHA256SUMS.txt --title 'WARDOGS Radio v${{ steps.version.outputs.version }}' --notes-file docs/ReleaseNotes-v${{ steps.version.outputs.version }}.md --latest
      - name: Verify published updater chain
        if: github.event_name == 'push' || inputs.dry_run == false
        shell: pwsh
        run: .\scripts\verify-published-updater.ps1 -ReleaseTag '${{ steps.version.outputs.tag }}'
